<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ping Pong">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Ping Pong Ranking</title>
</head>
<body>
  <header class="topbar">
    <h1>🏓 Ping Pong Ranking</h1>
    <button id="refreshBtn" class="icon-btn" aria-label="Aggiorna dati">⟳</button>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="view"></main>

  <button id="fab" class="fab" aria-label="Nuova partita">+</button>

  <nav class="tabbar">
    <button data-tab="ranking" class="active"><span>🏆</span>Classifica</button>
    <button data-tab="matches"><span>📋</span>Partite</button>
    <button data-tab="players"><span>👥</span>Giocatori</button>
    <button data-tab="settings"><span>⚙️</span>Impostazioni</button>
  </nav>

  <dialog id="modal"><div id="modalBody"></div></dialog>
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
